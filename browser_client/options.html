<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IPv0x Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="settings-container">
    <h2>IPv0x Settings</h2>
    <label for="tor-address">TOR Network Address (IP:Port):</label>

  </div>
  <script src="options.js"></script>
</body>
</html>
